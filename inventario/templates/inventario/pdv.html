{% extends 'inventario/base.html' %}
{% load static %}

{% block content %}
<div class="row g-3">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 mb-3">
            <div class="card-header text-white fw-bold" style="background-color: #C60C30;">🛒 Carrinho de Compras</div>
            <div class="p-3">

                <div class="table-responsive mb-4" style="max-height: 350px; overflow-y: auto;">
                    <table class="table table-hover align-middle text-center mb-0">
                        <thead class="table-light sticky-top">
                            <tr>
                                <th class="text-start">Produto</th>
                                <th width="80">Qtd</th>
                                <th width="100">Unit.</th>
                                <th width="120">Unit. c/ Desc.</th>
                                <th width="100">Total</th>
                                <th width="50"></th>
                            </tr>
                        </thead>
                        <tbody id="tabelaCarrinho"></tbody>
                    </table>
                </div>

                <hr class="opacity-25 my-3">

                <div id="areaTags" class="d-flex flex-wrap mb-2"></div>

                <div class="position-relative">
                    <input type="text" id="inputBusca" class="form-control form-control-lg shadow-sm border-secondary" placeholder="Passe o leitor de código de barras ou digite e dê ENTER..." onkeydown="tratarInputBusca(event, this)">
                    <div id="resultadosBusca" class="list-group shadow-lg position-absolute w-100 mt-1" style="z-index: 1000; display: none; max-height: 250px; overflow-y: auto;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm border p-4 h-100" style="background-color: #dee2e6; border: 1px solid #ced4da !important;">
            <h3 class="text-center mb-4 fw-bold text-dark">FECHAMENTO</h3>

            <div class="mb-3">
                <label class="form-label small fw-bold text-dark">👤 Cliente</label>
                <select id="selectCliente" class="form-select border-secondary shadow-sm" onchange="verificarPontos()">
                    <option value="">CONSUMIDOR PADRÃO</option>
                    {% for c in clientes %}
                    <option value="{{ c.nome }}">{{ c.nome }}</option>
                    {% endfor %}
                </select>
                <div id="areaResgatePontos" class="mt-2" style="display: none;"></div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold text-dark">👷 Indicante / Pintor</label>
                <select id="selectIndicante" class="form-select border-secondary shadow-sm">
                    <option value="">-- NENHUM INDICANTE --</option>
                    {% for pintor in pintores %}
                    <option value="{{ pintor.nome }}">{{ pintor.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold text-dark">💼 Vendedor</label>
                <select id="selectVendedor" class="form-select border-secondary shadow-sm">
                    {% for v in vendedores %}
                    <option value="{{ v.login }}">{{ v.login }}</option>
                    {% endfor %}
                </select>
            </div>

            <hr class="my-4" style="border-color: #adb5bd;">

            <div class="d-flex justify-content-between mb-1 fs-6 text-dark">
                <span>Subtotal:</span>
                <strong id="txtSubtotal">R$ 0,00</strong>
            </div>

            <div class="d-flex justify-content-between mb-2 fs-6 text-danger">
                <span>Desconto:</span>
                <strong id="txtDesconto">- R$ 0,00</strong>
            </div>

            <div class="d-flex justify-content-between mb-3 fs-4 text-dark fw-bold">
                <span>TOTAL DA COMPRA:</span>
                <strong id="txtTotalCompra">R$ 0,00</strong>
            </div>

            <div class="row g-2 mb-3 mt-2">
                <div class="col-8">
                    <label class="form-label small fw-bold text-dark">VALOR FINAL</label>
                    <input type="number" id="inputValorFinal" class="form-control form-control-lg fw-bold text-center fs-3 border-secondary shadow-sm" step="0.01" oninput="aplicarDescontoGlobalPorValor()">
                </div>
                <div class="col-4">
                    <label class="form-label small fw-bold text-dark">Desc. (%)</label>
                    <input type="number" id="inputDescontoPerc" class="form-control form-control-lg fw-bold text-center fs-3 border-secondary shadow-sm" step="0.1" oninput="aplicarDescontoGlobalPorPorcentagem()">
                </div>
            </div>

            <div class="row g-2 mb-4">
                <div class="col-6">
                    <label class="form-label small fw-bold text-dark">RECEBIDO (R$)</label>
                    <input type="number" id="inputValorRecebido" class="form-control fw-bold text-center border-secondary shadow-sm" step="0.01" min="0" placeholder="0,00" oninput="calcularTroco()">
                </div>
                <div class="col-6">
                    <label class="form-label small fw-bold text-dark">TROCO (R$)</label>
                    <input type="text" id="inputTroco" class="form-control fw-bold text-center text-success border-secondary shadow-sm" readonly value="R$ 0,00">
                </div>
            </div>

            <div class="d-flex gap-2 mb-2">
                <button class="btn btn-lg w-50 fw-bold py-3 shadow-sm text-dark" style="background-color: #FFB81C; border: none;" onclick="finalizarOperacao('ORCAMENTO')">
                    📝 ORÇAMENTO
                </button>
                <button class="btn btn-lg w-50 fw-bold py-3 shadow-sm text-white" style="background-color: #00C853; border: none;" onclick="finalizarOperacao('VENDA')">
                    💰 VENDA
                </button>
            </div>
            <button class="btn btn-sm w-100 mt-2 fw-bold text-white bg-danger shadow-sm" onclick="limparCarrinho()">CANCELAR COMPRA</button>
        </div>
    </div>
</div>

<script>
    const csrfTokenConfig = '{{ csrf_token }}';
</script>
<script src="{% static 'js/pdv.js' %}"></script>
{% endblock %}
